<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validador de CPF</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --ok: #35c46b;
    --err: #ff5c5c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  h1 {
    font-size: 20px;
    margin: 0 0 6px;
  }

  p.subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    flex: 1;
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 16px;
    letter-spacing: 0.5px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0 20px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  button:hover {
    filter: brightness(1.1);
  }

  button:active {
    filter: brightness(0.95);
  }

  .result {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
    align-items: center;
    gap: 10px;
  }

  .result.show {
    display: flex;
  }

  .result.valid {
    background: rgba(53, 196, 107, 0.12);
    border: 1px solid rgba(53, 196, 107, 0.4);
    color: var(--ok);
  }

  .result.invalid {
    background: rgba(255, 92, 92, 0.12);
    border: 1px solid rgba(255, 92, 92, 0.4);
    color: var(--err);
  }

  .icon {
    font-size: 18px;
    line-height: 1;
  }

  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Validador de CPF</h1>
    <p class="subtitle">Digite um CPF para verificar se ele é válido.</p>

    <label for="cpf">CPF</label>
    <div class="input-row">
      <input type="text" id="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" autocomplete="off">
      <button id="btnValidar">Validar</button>
    </div>

    <div class="result" id="resultado">
      <span class="icon" id="resultadoIcon"></span>
      <span id="resultadoTexto"></span>
    </div>

    <p class="hint">A validação é feita localmente, no seu navegador. Nenhum dado é enviado a servidores.</p>
  </div>

  <script>
    const input = document.getElementById('cpf');
    const btn = document.getElementById('btnValidar');
    const resultado = document.getElementById('resultado');
    const resultadoIcon = document.getElementById('resultadoIcon');
    const resultadoTexto = document.getElementById('resultadoTexto');

    // Formata enquanto digita: 000.000.000-00
    input.addEventListener('input', () => {
      let v = input.value.replace(/\D/g, '').slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      input.value = v;
      esconderResultado();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') validar();
    });

    btn.addEventListener('click', validar);

    function esconderResultado() {
      resultado.classList.remove('show', 'valid', 'invalid');
    }

    function mostrarResultado(valido, mensagem) {
      resultado.classList.add('show');
      resultado.classList.toggle('valid', valido);
      resultado.classList.toggle('invalid', !valido);
      resultadoIcon.textContent = valido ? '✓' : '✕';
      resultadoTexto.textContent = mensagem;
    }

    function validar() {
      const cpf = input.value.replace(/\D/g, '');

      if (cpf.length !== 11) {
        mostrarResultado(false, 'CPF deve conter 11 dígitos.');
        return;
      }

      if (validarCPF(cpf)) {
        mostrarResultado(true, 'CPF válido.');
      } else {
        mostrarResultado(false, 'CPF inválido.');
      }
    }

    function validarCPF(cpf) {
      // Rejeita sequências de dígitos repetidos (ex: 111.111.111-11)
      if (/^(\d)\1{10}$/.test(cpf)) return false;

      const digitos = cpf.split('').map(Number);

      // Cálculo do primeiro dígito verificador
      let soma = 0;
      for (let i = 0; i < 9; i++) {
        soma += digitos[i] * (10 - i);
      }
      let resto = (soma * 10) % 11;
      if (resto === 10) resto = 0;
      if (resto !== digitos[9]) return false;

      // Cálculo do segundo dígito verificador
      soma = 0;
      for (let i = 0; i < 10; i++) {
        soma += digitos[i] * (11 - i);
      }
      resto = (soma * 10) % 11;
      if (resto === 10) resto = 0;
      if (resto !== digitos[10]) return false;

      return true;
    }
  </script>

</body>
</html>
